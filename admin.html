<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexTap — Painel Admin</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0f5f1;--card:#fff;--tx:#0f1a13;--mut:#5b6b60;--br:#dfe8e2;--pr:#15803d;--pr2:#0f6a31;--soft:#e4f0e8;--dk:#111827}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1410;--card:#16211b;--tx:#eaf3ed;--mut:#9bb0a3;--br:#243329;--soft:#1b2a21}}
:root[data-theme="dark"]{--bg:#0d1410;--card:#16211b;--tx:#eaf3ed;--mut:#9bb0a3;--br:#243329;--soft:#1b2a21}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
.logo{font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px}.logo i{width:30px;height:30px;border-radius:8px;background:var(--dk);display:grid;place-items:center;color:#fff;font-style:normal}
.btn{display:inline-block;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:10px;font:600 14px inherit;cursor:pointer}.btn.p{background:var(--dk);border-color:var(--dk);color:#fff}.btn.p:hover{opacity:.9}.btn.s{padding:5px 10px;font-size:12px}.btn.d{border-color:#dc2626;color:#dc2626}
input,select{padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;width:100%;min-width:0}
label{display:grid;gap:4px;font-size:12px;color:var(--mut)}.mut{color:var(--mut)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}#auth .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--br);border-radius:18px;padding:28px;display:grid;gap:12px}
#app{display:none;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--dk);color:#cbd5c9;border-right:1px solid var(--br);padding:18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
aside small{color:#7d8c86;font-size:11px;letter-spacing:.06em;margin:14px 10px 4px}aside a{padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;color:#e5efe8}aside a.on{background:#1f2a24;color:#fff;font-weight:700}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #2a362f;border-radius:12px;font-size:13px}.av{width:34px;height:34px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700}
main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}h2{margin:0}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:18px;margin-top:14px}.card h3{margin:0 0 10px;font-size:16px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}.k div{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:16px}.k small{color:var(--mut)}.k b{display:block;font-size:22px;margin-top:4px}.k div:first-child{background:var(--dk);color:#fff;border-color:var(--dk)}.k div:first-child small{color:#c9d3cd}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.pill{padding:7px 13px;border-radius:99px;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer;font-size:13px}.pill.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--br);white-space:nowrap}th{color:var(--mut);font-weight:600}
.st{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.st.pendente{background:#fef3c7;color:#92400e}.st.enviado{background:#dbeafe;color:#1e40af}.st.entregue{background:#dcfce7;color:#166534}.st.g{background:#e5e7eb;color:#374151}.st.aguardando_pagamento{background:#fef3c7;color:#92400e}.st.pago{background:#dcfce7;color:#166534}.st.cancelado{background:#fee2e2;color:#991b1b}.st.em_producao{background:#ede9fe;color:#5b21b6}.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}.fila button{text-align:left;border:1px solid var(--br);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--tx)}.fila button b{display:block;font-size:24px}.fila button small{color:var(--mut)}.fila button.al{border-color:#dc2626}.fila button.al b{color:#dc2626}.bars i.pe{background:#f59e0b;border-radius:6px 6px 0 0}.bars i.pg{border-radius:0}.sm{font-size:11px;color:var(--mut);display:block;margin-top:2px}.lg2{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.st.ativa{background:#dcfce7;color:#166534}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{background:var(--dk);border-radius:6px 6px 0 0;display:block;min-height:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tier{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--br);border-radius:10px;margin-bottom:6px}
#mo{display:none;position:fixed;inset:0;background:#0007;z-index:20;place-items:center;padding:16px}#mo .box{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:420px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.bar{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--br)}
.lgc{background:#fff;border-radius:14px;padding:6px 12px;justify-content:center;margin-bottom:6px}.lg{height:58px;width:auto;display:block}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center}.lgc{flex:none;margin:0 8px 0 0;padding:4px 8px}.lg{height:40px}aside small,.me{display:none}aside a{white-space:nowrap}.g2,.g3{grid-template-columns:1fr}}
</style></head><body>

<div id="auth"><div class="box">
<div class="logo" style="justify-content:center"><img src="/logo.png" alt="NexTap" style="height:88px;width:auto"></div>
<div class="mut" style="text-align:center;font-size:13px;margin-top:-6px">Painel do fornecedor</div>
<label>E-mail<input id="ae" type="email" value="admin@nextap.com.br"></label>
<label>Senha de administrador<input id="ap" type="password" placeholder="Senha do fornecedor"></label>
<button class="btn p" onclick="sub()">Entrar</button>
<small class="mut">Acesso restrito ao fornecedor. Use o e-mail e a senha definidos em ADMIN_EMAIL / ADMIN_PASSWORD no backend.</small></div></div>

<div id="app">
<aside><a class="logo lgc" href="/" aria-label="NexTap"><img src="/logo.png" alt="NexTap" class="lg"></a><small style="margin-top:4px">PAINEL ADMIN · FORNECEDOR</small>
<small>PAINEL</small><a data-v="dash" onclick="nav('dash')">▦ Visão geral</a><a data-v="revs" onclick="nav('revs')">👥 Revendedores</a><a data-v="pedidos" onclick="nav('pedidos')">📦 Pedidos</a><a data-v="placas" onclick="nav('placas')">▣ Placas emitidas</a>
<small>GESTÃO</small><a data-v="fin" onclick="nav('fin')">💰 Financeiro</a><a data-v="forn" onclick="nav('forn')">🏭 Fornecedores</a><a data-v="cfg" onclick="nav('cfg')">⚙ Preços</a><a data-v="dados" onclick="nav('dados')">🛡 Dados e backups</a>
<div class="me"><div class="av">A</div><div><b>Admin</b><div class="mut" style="color:#7d8c86">Fornecedor</div></div><button class="btn s" style="margin-left:auto" onclick="out()" title="Sair">⎋</button></div></aside>
<main><div class="top"><div id="hd"></div><span class="row" style="margin:0"><button class="btn" onclick="baixarBackup()" title="Baixar uma cópia completa dos dados">⬇ Backup</button><button class="btn" onclick="theme()">◐</button></span></div><div id="v"></div></main></div>
<div id="mo"><div class="box" id="mb"></div></div>

<script>
/* ==== CONFIGURAÇÃO ==== */
// Troque pela URL pública do seu backend depois do deploy (Railway/Render), terminando em /api
// Mesmo domínio do backend: as páginas são servidas pelo próprio Railway, então a API fica em /api
// (sem CORS). Se abrir o arquivo direto do computador, cai no endereço público do backend.
const API_BASE = (location.protocol.indexOf("http") === 0 ? location.origin : "https://nextap-production-6c30.up.railway.app") + "/api";
/* ======================= */

var $=function(i){return document.getElementById(i)},per='all',cur='dash',TOKEN=null;
var OVER={},REVS=[],ORDERS=[],PLATES=[],TIERS=[];
function R(n){return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function U(s){if(s instanceof Date)return s;s=String(s||'');if(/^\d{4}-\d\d-\d\d[ T]\d\d:\d\d(:\d\d)?$/.test(s))return new Date(s.replace(' ','T')+(s.length===16?':00':'')+'Z');return new Date(s)}
function fd(d){return U(d).toLocaleDateString('pt-BR')}
function fdh(d){return d?U(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}
function theme(){var r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}

async function api(path,opts){
  opts=opts||{};var h=opts.headers||{};h['Content-Type']='application/json';if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  var r;try{r=await fetch(API_BASE+path,Object.assign({},opts,{headers:h}))}
  catch(e){throw new Error('Não foi possível conectar ao servidor.')}
  var data=null;try{data=await r.json()}catch(e){}
  if(!r.ok)throw new Error((data&&data.error)||'Ocorreu um erro inesperado.');
  return data;
}
async function sub(){var email=$('ae').value.trim(),pass=$('ap').value;
try{var r=await api('/auth/admin-login',{method:'POST',body:JSON.stringify({email:email,password:pass})});TOKEN=r.token;try{localStorage.setItem('nx_admin_token',TOKEN)}catch(e){}await boot()}
catch(e){alert(e.message)}}
function out(){TOKEN=null;try{localStorage.removeItem('nx_admin_token')}catch(e){}$('app').style.display='none';$('auth').style.display='grid'}
async function boot(){await loadAll();$('auth').style.display='none';$('app').style.display='grid';nav('dash')}
async function loadAll(){var r=await Promise.all([api('/admin/overview'),api('/admin/resellers'),api('/admin/orders'),api('/admin/plates'),api('/admin/price-tiers')]);
OVER=r[0];REVS=r[1];ORDERS=r[2];PLATES=r[3];TIERS=r[4]}

function inP(x){var d=U(x.created_at),n=new Date();if(per==='all')return 1;if(per==='today')return d.toDateString()===n.toDateString();if(per==='month')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();return (n-d)/864e5<=+per}
function pills(){return '<div class="row">'+[['today','Hoje'],['7','7 dias'],['30','30 dias'],['90','90 dias'],['month','Este mês'],['all','Tudo']].map(function(p){return '<button class="pill '+(per===p[0]?'on':'')+'" onclick="per=\''+p[0]+'\';draw()">'+p[1]+'</button>'}).join('')+'</div>'}
function head(t,s){$('hd').innerHTML='<h2>'+t+'</h2><span class="mut">'+s+'</span>'}
function nav(v){cur=v;if(v==='cfg'&&FRETE===null)loadFrete();if(v==='dados')loadSis();if(v==='forn')loadForn();if(v==='fin'){if(FT==='lucro')loadLuc();else if(FT==='desp')loadDesp();else if(FT==='cus')loadCus()}document.querySelectorAll('aside a[data-v]').forEach(function(a){a.classList.toggle('on',a.dataset.v===v)});draw()}
function mo(h){$('mb').innerHTML=h;$('mo').style.display='grid'}function cl(){$('mo').style.display='none'}
$('mo').onclick=function(e){if(e.target===this)cl()};
function draw(){var aviso=(OVER&&OVER.persistente===false)?'<div class="card" style="border-color:#dc2626;margin-bottom:12px"><b style="color:#dc2626">⚠ Atenção: os dados não estão sendo guardados de forma permanente.</b><br><span class="mut">No Railway, crie um Volume (montado em /data) e conecte ao serviço. Até lá, cadastros e pedidos são apagados a cada atualização do sistema.</span></div>':'';
$('v').innerHTML=aviso+({dash:vDash,revs:vRevs,pedidos:vPedidos,placas:vPlacas,fin:vFin,forn:vForn,cfg:vCfg,dados:vDados})[cur]()}
async function baixarBackup(){
  try{
    var r=await fetch(API_BASE+'/admin/backup',{headers:{Authorization:'Bearer '+TOKEN}});
    if(!r.ok)throw new Error('Não foi possível gerar o backup agora.');
    var b=await r.blob(),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='nextap-backup-'+new Date().toISOString().slice(0,10)+'.db';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  }catch(e){alert(e.message)}
}
var STM={aguardando_pagamento:'Aguardando pagamento',pago:'Pedido recebido',em_producao:'Em produção',enviado:'Enviado',entregue:'Entregue',cancelado:'Cancelado',estoque:'Não configurada',ativa:'Configurada'};
function stTag(s){return '<span class="st '+(s||'').toLowerCase()+'">'+(STM[s]||s)+'</span>'}

/* dash */
function sm(l){return l.reduce(function(s,o){return s+o.total},0)}
function isPg(o){return ['pago','em_producao','enviado','entregue'].indexOf(o.status)>-1}
function isAw(o){return o.status==='aguardando_pagamento'}
function vDash(){head('Visão geral','Desempenho de todos os revendedores.');var os=ORDERS.filter(inP),pg=os.filter(isPg),aw=os.filter(isAw),hoje=new Date();
var b=[],mx=1;for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var dia=function(o){return U(o.created_at).toDateString()===d.toDateString()};var v1=sm(os.filter(function(o){return isPg(o)&&dia(o)})),v2=sm(os.filter(function(o){return isAw(o)&&dia(o)}));b.push([d.toLocaleDateString('pt-BR',{weekday:'short'}),v1,v2]);mx=Math.max(mx,v1+v2)}
var aviso=aw.length?'<div class="card" style="border-color:#f59e0b;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span><b>'+aw.length+' pedido(s) aguardando pagamento</b> · '+R(sm(aw))+' a receber.<br><small class="mut">Se algum já foi pago, confira no Mercado Pago.</small></span><span class="row" style="margin:0"><button class="btn p" onclick="conferirTodos()">🔄 Conferir no Mercado Pago</button><button class="btn" onclick="pf=\'aguardando_pagamento\';nav(\'pedidos\')">Ver pedidos</button></span></div>':'';
var fRec=ORDERS.filter(function(o){return o.status==='pago'}),fPro=ORDERS.filter(function(o){return o.status==='em_producao'}),fAtr=fPro.filter(function(o){return o.atrasado}),fEnv=ORDERS.filter(function(o){return o.status==='enviado'});
var F=function(n,l,f,al){return '<button class="'+(al&&n?'al':'')+'" onclick="pf=\''+f+'\';nav(\'pedidos\')"><b>'+n+'</b><small>'+l+'</small></button>'};
var fila='<div class="fila">'+F(fRec.length,'Pedido recebido · iniciar produção','pago')+F(fPro.length,'Em produção','em_producao')+F(fAtr.length,'Produção atrasada','em_producao',1)+F(fEnv.length,'Enviados · aguardando entrega','enviado')+'</div>';
return pills()+aviso+fila+'<div class="k"><div><small>Faturamento (pedidos pagos)</small><b>'+R(sm(pg))+'</b></div><div><small>A receber (aguardando pagamento)</small><b>'+R(sm(aw))+'</b></div><div><small>Pedidos pagos</small><b>'+pg.length+'</b></div><div><small>Aguardando pagamento</small><b>'+aw.length+'</b></div><div><small>Revendedores cadastrados</small><b>'+OVER.revendedores+'</b></div><div><small>Placas emitidas</small><b>'+OVER.placas+'</b></div><div><small>Placas configuradas</small><b>'+OVER.ativas+'</b></div></div>'+
'<div class="g2"><div class="card"><h3>Pedidos (7 dias)</h3><div class="bars">'+b.map(function(x){var t=x[1]+x[2];return '<div><small>'+(t?R(t):'')+'</small><i class="pe" style="height:'+x[2]/mx*100+'%"></i><i class="pg" style="height:'+x[1]/mx*100+'%"></i>'+x[0]+'</div>'}).join('')+'</div><div class="lg2"><span><i style="background:var(--dk)"></i>Pago</span><span><i style="background:#f59e0b"></i>Aguardando pagamento</span></div></div>'+
'<div class="card"><h3>Últimos pedidos</h3>'+(os.length?os.slice(0,6).map(function(o){return '<div class="bar"><span>'+E(o.reseller_name)+' '+stTag(o.status)+'<br><small class="mut">'+fd(o.created_at)+' · '+o.qty_azul+' azul + '+o.qty_preta+' preta</small></span><b>'+R(o.total)+'</b></div>'}).join(''):'<p class="mut">Nenhum pedido no período.</p>')+'</div></div>'}
/* revendedores */
function vRevs(){head('Revendedores','Todos os revendedores cadastrados no sistema.');
return '<div class="card"><div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Pedidos</th><th>Gasto total</th><th>Placas</th><th>Vendas</th><th>Senha</th></tr>'+(REVS.length?REVS.map(function(x){return '<tr><td>'+E(x.name)+'</td><td>'+E(x.email)+'</td><td>'+E(x.whatsapp||'—')+'</td><td>'+x.pedidos+'</td><td>'+R(x.gasto)+'</td><td>'+x.placas+'</td><td>'+x.vendas+'</td><td><button class="btn s" title="Gerar link para o revendedor criar uma nova senha" onclick="rstLink('+x.id+')">🔑 Link de senha</button></td></tr>'}).join(''):'<tr><td colspan="8" class="mut">Nenhum revendedor cadastrado ainda.</td></tr>')+'</table></div></div>'}
/* pedidos */
var pf='todos';
var MPT={pending:'pendente no Mercado Pago',in_process:'em análise no Mercado Pago',authorized:'autorizado',rejected:'recusado no Mercado Pago',cancelled:'expirado/cancelado no Mercado Pago',refunded:'⚠ estornado',charged_back:'⚠ contestado (chargeback)'};
var SEL={};
function dm(s){if(!s)return '';var p=String(s).split('-');return p[2]+'/'+p[1]}
function pad5(n){return String(n).padStart(5,'0')}
function vPedidos(){head('Pedidos','Acompanhe o pagamento, a produção e o envio de cada pedido.');
  var defs=[['todos','Todos',function(o){return 1}],['aguardando_pagamento','Aguardando pagamento',isAw],['pago','Pedido recebido',function(o){return o.status==='pago'}],['em_producao','Em produção',function(o){return o.status==='em_producao'}],['enviado','Enviados',function(o){return o.status==='enviado'}],['entregue','Entregues',function(o){return o.status==='entregue'}],['cancelado','Cancelados',function(o){return o.status==='cancelado'}]];
  var f=defs.filter(function(x){return x[0]===pf})[0]||defs[0],lista=ORDERS.filter(f[2]),aw=ORDERS.filter(isAw);
  var pills='<div class="row">'+defs.map(function(x){var l=ORDERS.filter(x[2]);return '<button class="pill'+(pf===x[0]?' on':'')+'" onclick="pf=\''+x[0]+'\';draw()">'+x[1]+' ('+l.length+')</button>'}).join('')+'</div>';
  var resumo='<p class="mut" style="margin:10px 0 0">Recebido (pago até entregue): <b style="color:var(--tx)">'+R(sm(ORDERS.filter(isPg)))+'</b> · A receber: <b style="color:var(--tx)">'+R(sm(aw))+'</b> · Produção: '+(lista[0]&&lista[0].prazo_producao_dias||5)+' dias úteis</p>';
  var banner=aw.length?'<div class="row" style="margin-top:10px"><button class="btn p" onclick="conferirTodos()">🔄 Conferir todos os pendentes no Mercado Pago</button></div>':'';
  var nSel=Object.keys(SEL).filter(function(k){return SEL[k]&&ORDERS.some(function(o){return o.id==k&&o.status==='pago'})}).length;
  var lote=(pf==='pago'&&lista.length)?'<div class="row" style="margin-top:10px;align-items:center"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto" onchange="selTodos(this.checked)"> Selecionar todos</label><button class="btn p" onclick="loteProd()" '+(nSel?'':'disabled')+'>▶ Iniciar produção dos selecionados ('+nSel+')</button></div>':'';
  var B=function(t,fn,c){return '<button class="btn s'+(c?' p':'')+'" onclick="'+fn+'">'+t+'</button> '};
  var acoes=function(o){
    if(o.status==='aguardando_pagamento')return B('🔄 Conferir','conferirPed('+o.id+')')+B('✔ Confirmar pagamento','confirmarPag('+o.id+')',1)+B('✖ Cancelar','cancelarPed('+o.id+')');
    if(o.status==='pago')return B('▶ Iniciar produção','iniciarProd('+o.id+')',1)+B('📦 Enviar','abrirEnvio('+o.id+')');
    if(o.status==='em_producao')return B('📦 Enviar (código)','abrirEnvio('+o.id+')',1)+B('↩','voltar('+o.id+')');

  +'<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Notificações de pagamento (Mercado Pago)</h3><p class="mut" style="margin:0 0 10px">O que o sistema recebeu e conferiu sobre cada pedido. Útil para entender por que um pedido ficou pendente.</p><div class="tw"><table><tr><th>Quando</th><th>Origem</th><th>Pedido</th><th>Status no MP</th><th>Resultado</th></tr>'+(EVT.length?EVT.map(function(e){return '<tr><td>'+fdh(e.created_at)+'</td><td>'+E(e.origem)+'</td><td>'+(e.order_id?'#'+String(e.order_id).padStart(5,'0'):'—')+'</td><td>'+E(e.mp_status||'—')+'</td><td>'+E(evTxt(e))+'</td></tr>'}).join(''):'<tr><td colspan="5" class="mut">Nenhuma notificação recebida ainda.</td></tr>')+'</table></div></div>'
  +'<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Reativar um revendedor</h3><p class="mut" style="margin:0 0 10px">Para quem já tinha conta e não aparece mais: cadastre aqui e envie o link para a pessoa escolher uma nova senha.</p>'
  +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px"><label>Nome<input id="nr1"></label><label>E-mail<input id="nr2" type="email"></label><label>WhatsApp<input id="nr3" inputmode="tel"></label></div>'
  +'<div class="row"><button class="btn p" onclick="novoRev()">Cadastrar e gerar link</button></div></div>'}
async function baixarArq(url,nome){try{var r=await fetch(API_BASE+url,{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error('Não foi possível gerar o arquivo agora.');var b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},5000)}catch(e){alert(e.message)}}
function baixarCsv(){baixarArq('/admin/export/revendedores','nextap-revendedores-'+new Date().toISOString().slice(0,10)+'.csv')}
function resumoRestore(r){return (r.modo==='revendedores'?'Revendedores recuperados: '+r.acrescentados+'.':'Dados restaurados.')+'\nAgora: '+r.depois.revendedores+' revendedores, '+r.depois.pedidos+' pedidos, '+r.depois.placas+' placas.\n(Antes: '+r.antes.revendedores+' revendedores, '+r.antes.pedidos+' pedidos, '+r.antes.placas+' placas. Uma cópia do estado anterior ficou guardada.)'}
async function restaurarLocal(nome,modo){
  if(!confirm(modo==='substituir'?'Substituir TODOS os dados pelo conteúdo de '+nome+'? Uma cópia do estado atual será guardada antes.':'Recuperar os revendedores que estão em '+nome+' e não existem agora? Nada será apagado.'))return;
  try{var r=await api('/admin/restore-local',{method:'POST',body:JSON.stringify({nome:nome,modo:modo})});alert(resumoRestore(r));await loadAll();await loadSis()}catch(e){alert(e.message)}}
async function restaurarUpload(){
  var f=$('rsf').files[0],modo=$('rsm').value;if(!f)return alert('Escolha o arquivo de backup (.db).');
  if(!confirm(modo==='substituir'?'Substituir TODOS os dados pelo conteúdo de '+f.name+'? Uma cópia do estado atual será guardada antes.':'Recuperar os revendedores de '+f.name+' que não existem agora? Nada será apagado.'))return;
  try{var r=await fetch(API_BASE+'/admin/restore?modo='+modo,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/octet-stream'},body:f});var j=await r.json();if(!r.ok)throw new Error(j.error||'Falha ao restaurar.');alert(resumoRestore(j));await loadAll();await loadSis()}catch(e){alert(e.message)}}
async function novoRev(){
  try{var r=await api('/admin/resellers',{method:'POST',body:JSON.stringify({name:$('nr1').value,email:$('nr2').value,whatsapp:$('nr3').value})});await loadAll();window.RSTL=r.link;
  mo('<h3 style="margin:0">Revendedor cadastrado ✓</h3><p class="mut" style="margin:0">Envie este link para a pessoa criar a senha (vale 72 horas, uso único).</p><input id="rstin" readonly value="'+E(r.link)+'" onclick="this.select()"><div class="row"><button class="btn p" id="rstcp" onclick="cpRst()">Copiar link</button><button class="btn" onclick="cl()">Fechar</button></div>');draw()}catch(e){alert(e.message)}}
/* placas */
function vPlacas(){head('Placas emitidas','Todas as placas já geradas no sistema, por revendedor.');
return '<div class="card"><div class="tw"><table><tr><th>Código</th><th>Revendedor</th><th>Cor</th><th>Status</th><th>Cliente final</th><th>Destino</th></tr>'+(PLATES.length?PLATES.map(function(p){return '<tr><td>#'+String(p.id).padStart(4,'0')+'</td><td>'+E(p.reseller_name)+'</td><td>'+p.color+'</td><td>'+stTag(p.status)+'</td><td>'+E(p.client_name||'—')+'</td><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">'+E(p.destination_url||'—')+'</td></tr>'}).join(''):'<tr><td colspan="6" class="mut">Nenhuma placa emitida ainda.</td></tr>')+'</table></div></div>'}
/* financeiro */
function finResumo(){var pagos=ORDERS.filter(isPg),aw=ORDERS.filter(isAw);
var fr=pagos.reduce(function(s,o){return s+(o.shipping_fee||0)},0),fat=sm(pagos),n=pagos.reduce(function(s,o){return s+o.qty_azul+o.qty_preta},0),man=pagos.filter(function(o){return o.paid_manually}).length;
var porRev={};pagos.forEach(function(o){porRev[o.reseller_name]=(porRev[o.reseller_name]||0)+o.total});
var forma={pix:0,credit_card:0};pagos.forEach(function(o){forma[o.payment_method]=(forma[o.payment_method]||0)+o.total});
return '<div class="k"><div><small>Faturamento (recebido)</small><b>'+R(fat)+'</b></div><div><small>A receber (aguardando pagamento)</small><b>'+R(sm(aw))+'</b></div><div><small>Pedidos pagos</small><b>'+pagos.length+'</b></div><div><small>Ticket médio por pedido</small><b>'+R(pagos.length?fat/pagos.length:0)+'</b></div><div><small>Placas vendidas a revendedores</small><b>'+n+'</b></div><div><small>Receita só das placas (sem frete)</small><b>'+R(fat-fr)+'</b></div><div><small>Frete cobrado dos clientes</small><b>'+R(fr)+'</b></div></div>'+
'<div class="g2"><div class="card"><h3>Faturamento por revendedor</h3>'+(Object.keys(porRev).length?Object.keys(porRev).map(function(k){return '<div class="bar"><span>'+E(k)+'</span><b>'+R(porRev[k])+'</b></div>'}).join(''):'<p class="mut">Sem faturamento ainda.</p>')+'</div>'+
'<div class="card"><h3>Recebido por forma de pagamento</h3><div class="bar"><span>Pix</span><b>'+R(forma.pix||0)+'</b></div><div class="bar"><span>Cartão</span><b>'+R(forma.credit_card||0)+'</b></div>'+(man?'<p class="mut" style="margin:10px 0 0">'+man+' pedido(s) confirmado(s) manualmente — veja a observação em Pedidos.</p>':'')+'<p class="mut" style="margin:10px 0 0">Só entram aqui pedidos pagos, em produção, enviados e entregues. O faturamento inclui o frete cobrado (veja a separação nos cartões acima); o custo real dos Correios você lança por fora. Pedidos aguardando pagamento aparecem em "A receber".</p></div></div>'+semPed()}
var SEMP=null;
function semPed(){return '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Conferir com o Mercado Pago</h3><p class="mut" style="margin:0 0 10px">Procura pagamentos aprovados de placas NexTap (últimos 90 dias) que ainda não estão ligados a nenhum pedido aqui — por exemplo, vendas anteriores à proteção dos dados.</p><div class="row" style="margin:0 0 10px"><button class="btn p" onclick="buscarSemPed()">🔎 Buscar pagamentos sem pedido</button></div>'+(SEMP===null?'':SEMP.sem_token?'<p class="mut">O Mercado Pago não está configurado no servidor.</p>':SEMP.itens.length?'<div class="tw"><table><tr><th>Data</th><th>Cliente</th><th>E-mail</th><th>Valor</th><th>Mercado Pago</th></tr>'+SEMP.itens.map(function(x){return '<tr><td>'+fdh(x.data)+'</td><td>'+E(x.nome||'—')+'</td><td>'+E(x.email||'—')+'</td><td>'+R(x.valor)+'</td><td>#'+E(x.id)+'</td></tr>'}).join('')+'</table></div><small class="mut">Total: '+SEMP.itens.length+' pagamento(s) · '+R(SEMP.itens.reduce(function(s,x){return s+x.valor},0))+'. Entre em contato com essas pessoas para refazer o pedido (e o cadastro, se precisar: Dados e backups → Reativar um revendedor).</small>':'<p style="color:#16a34a;margin:0"><b>✔ Tudo conciliado:</b> todos os pagamentos aprovados têm pedido no sistema.</p>')+'</div>'}
async function buscarSemPed(){try{SEMP=await api('/admin/mp-sem-pedido')}catch(e){alert(e.message);return}draw()}
/* preços */
var TT=null;
var FRETE=null;
async function loadFrete(){try{FRETE=(await api('/admin/frete')).frete}catch(e){FRETE=null}if(cur==='cfg')draw()}
async function fSave(){var v=String($('fv').value).replace(',','.');try{var r=await api('/admin/frete',{method:'PUT',body:JSON.stringify({valor:v})});FRETE=r.frete;draw();toast('Frete salvo: '+R(FRETE)+' por pedido ✓')}catch(e){alert(e.message)}}
function freteCard(){return '<div class="card" style="max-width:520px;margin-top:14px"><h3 style="margin:0 0 6px">Frete fixo por pedido</h3><p class="mut" style="margin:0 0 10px">Valor somado ao total de <b>cada pedido</b> (não por placa), para qualquer CEP do Brasil. Aparece para o revendedor antes de pagar e é cobrado junto, no Pix ou no cartão.</p>'+(FRETE===null?'<p class="mut">Carregando…</p>':'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">R$ <input id="fv" style="width:110px;font-size:18px;font-weight:700" inputmode="decimal" value="'+FRETE.toFixed(2).replace('.',',')+'"> <button class="btn p" onclick="fSave()">Salvar frete</button></div><small class="mut" style="display:block;margin-top:8px">Vale na hora para novos pedidos. Pedidos já feitos mantêm o frete que foi cobrado. Use R$ 0,00 para frete grátis.</small>')+'</div>'}
function vCfg(){TT=TT||TIERS.map(function(t){return {min_qty:t.min_qty,max_qty:t.max_qty,unit_price:t.unit_price}});head('Configurações de preço','Faixas de quantidade usadas no site e no painel do revendedor.');
return '<div class="card" style="max-width:520px"><div id="tl">'+TT.map(function(x,i){return '<div class="tier"><input style="width:70px" value="'+x.min_qty+'" onchange="tEd('+i+',\'min_qty\',this.value)"> a <input style="width:70px" value="'+(x.max_qty>=1000000?'':x.max_qty)+'" placeholder="∞" onchange="tEd('+i+',\'max_qty\',this.value)"> placas → R$ <input style="width:80px" value="'+x.unit_price+'" onchange="tEd('+i+',\'unit_price\',this.value)"> <button class="btn s d" onclick="tDel('+i+')">✕</button></div>'}).join('')+'</div><button class="btn s" onclick="tAdd()">＋ Faixa</button><div class="row"><button class="btn p" onclick="tSave()">Salvar tabela</button></div><small class="mut">Estes preços passam a valer imediatamente no site, no painel do revendedor e na cobrança. O <b>pedido mínimo</b> é onde começa a primeira faixa (hoje: '+(TT.length?Math.min.apply(null,TT.map(function(x){return x.min_qty})):1)+' placas).</small></div>'+freteCard()}
function tEd(i,k,v){TT[i][k]=(v===''&&k==='max_qty')?1000000:+v}
function tAdd(){TT.push({min_qty:1,max_qty:1,unit_price:15});draw()}
function tDel(i){TT.splice(i,1);draw()}
async function tSave(){try{await api('/admin/price-tiers',{method:'POST',body:JSON.stringify({tiers:TT})});TIERS=await api('/admin/price-tiers');alert('Tabela salva.')}catch(e){alert(e.message)}}

(function(){var t=null;try{t=localStorage.getItem('nx_admin_token')}catch(e){}
if(t){TOKEN=t;boot().catch(function(){out()})}})();
</script></body></html>
